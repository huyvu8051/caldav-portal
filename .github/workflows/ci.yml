name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # The db tests take a schema each and run against a real Postgres. A
      # faked pool would not test the thing they are about -- `WHERE
      # caldav_username IS NULL` only means anything if a database enforces it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: caldav_portal
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Three gates, in the order CI runs them, because running the later ones
      # locally and skipping the first is how two builds in a row were spent
      # on a formatting diff.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --no-default-features --features ssr -- -D warnings
      - name: cargo test
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/caldav_portal
        run: cargo test --no-default-features --features ssr
      # The wasm half is not exercised by any of the above, and a lib that
      # stops compiling for the browser is a page that renders and then never
      # becomes interactive -- which looks like working software.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features hydrate

  image:
    name: Build & Push
    # No `needs: test`, deliberately. The two jobs ran back to back -- 1.6
    # minutes of tests in front of 2.5 minutes of image build, for 4.1 total
    # -- and the obvious fix was to drop the tests. Measured, that saves 1.6
    # minutes; running the jobs side by side saves the same 1.6 and keeps the
    # tests, because the total becomes the longer of the two rather than the
    # sum.
    #
    # What is given up is the gate, not the tests: a red suite no longer stops
    # the image. That is the trade, and it is a real one -- so the run still
    # goes red, visibly, and a failing test on main is something to act on
    # rather than something to discover later.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/huyvu8051/caldav-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
